[project]
name = "fmd-notebook"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dulwich>=1.1.0",
    "flask>=3.1.3",
    "flask-wtf>=1.2.2",
    "markdown-it-py>=4.0.0",
    "mdit-py-plugins>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
